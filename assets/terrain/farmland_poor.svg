<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="furrow-poor" width="256" height="256" patternUnits="userSpaceOnUse">
      <rect width="256" height="256" fill="#8c7f52"/>

      <!-- sparser, thinner furrows than Lush -->
      <path d="M0,24 Q64,14 128,24 T256,24" stroke="#786b42" stroke-width="4" fill="none" opacity="0.5"/>
      <path d="M0,70 Q64,82 128,70 T256,70" stroke="#786b42" stroke-width="4" fill="none" opacity="0.45"/>
      <path d="M0,118 Q64,108 128,118 T256,118" stroke="#786b42" stroke-width="4" fill="none" opacity="0.5"/>
      <path d="M0,168 Q64,180 128,168 T256,168" stroke="#786b42" stroke-width="3.5" fill="none" opacity="0.45"/>
      <path d="M0,216 Q64,206 128,216 T256,216" stroke="#786b42" stroke-width="4" fill="none" opacity="0.5"/>

      <!-- patches of bare, unworked earth -->
      <ellipse cx="80" cy="40" rx="40" ry="26" fill="#7a6d46" opacity="0.5"/>
      <ellipse cx="200" cy="150" rx="50" ry="30" fill="#7a6d46" opacity="0.5"/>
      <ellipse cx="60" cy="200" rx="34" ry="22" fill="#96895c" opacity="0.35"/>

      <!-- sparse, pale stubble rather than lush tufts -->
      <circle cx="30" cy="60" r="2" fill="#a89a63" opacity="0.6"/>
      <circle cx="150" cy="30" r="1.8" fill="#a89a63" opacity="0.55"/>
      <circle cx="230" cy="60" r="2" fill="#a89a63" opacity="0.6"/>
      <circle cx="40" cy="110" r="1.8" fill="#a89a63" opacity="0.55"/>
      <circle cx="180" cy="100" r="2" fill="#a89a63" opacity="0.6"/>
      <circle cx="100" cy="180" r="1.8" fill="#a89a63" opacity="0.55"/>
      <circle cx="230" cy="200" r="2" fill="#a89a63" opacity="0.6"/>
      <circle cx="20" cy="230" r="1.8" fill="#a89a63" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="url(#furrow-poor)"/>
</svg>
