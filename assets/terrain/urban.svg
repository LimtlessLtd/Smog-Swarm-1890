<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="terrace" width="256" height="256" patternUnits="userSpaceOnUse">
      <rect width="256" height="256" fill="#332f2c"/>

      <!-- Row 1: five terraced houses, deliberately uneven widths/tones -->
      <rect x="0" y="10" width="256" height="42" fill="#5b5450"/>
      <rect x="0" y="10" width="256" height="19" fill="#6b635d"/>
      <line x1="0" y1="31" x2="256" y2="31" stroke="#241f1c" stroke-width="2"/>
      <rect x="18" y="27" width="6" height="10" fill="#241f1c"/>
      <rect x="58" y="27" width="6" height="10" fill="#241f1c"/>
      <rect x="86" y="27" width="6" height="10" fill="#241f1c"/>
      <rect x="140" y="27" width="6" height="10" fill="#241f1c"/>
      <rect x="196" y="27" width="6" height="10" fill="#241f1c"/>
      <line x1="40" y1="10" x2="40" y2="52" stroke="#2c2724" stroke-width="1.5" opacity="0.6"/>
      <line x1="74" y1="10" x2="74" y2="52" stroke="#241f1c" stroke-width="2" opacity="0.7"/>
      <line x1="120" y1="10" x2="120" y2="52" stroke="#2c2724" stroke-width="1.5" opacity="0.6"/>
      <line x1="168" y1="10" x2="168" y2="52" stroke="#2c2724" stroke-width="1.5" opacity="0.6"/>
      <line x1="216" y1="10" x2="216" y2="52" stroke="#2c2724" stroke-width="1.5" opacity="0.6"/>
      <!-- a slightly taller/darker roof section (a mill or chapel breaking the terrace rhythm) -->
      <rect x="74" y="4" width="46" height="48" fill="#4a453f" opacity="0.9"/>
      <rect x="74" y="4" width="46" height="16" fill="#585148"/>

      <!-- a small yard/gap breaking the second row's rhythm -->
      <rect x="0" y="96" width="70" height="46" fill="#544e49"/>
      <rect x="0" y="96" width="70" height="18" fill="#645c56"/>
      <line x1="0" y1="114" x2="70" y2="114" stroke="#241f1c" stroke-width="2"/>
      <rect x="16" y="110" width="6" height="10" fill="#241f1c"/>
      <rect x="50" y="110" width="6" height="10" fill="#241f1c"/>
      <line x1="35" y1="96" x2="35" y2="142" stroke="#2c2724" stroke-width="1.5" opacity="0.6"/>

      <g transform="translate(96,120)">
        <ellipse cx="0" cy="0" rx="15" ry="10" fill="#40532c"/>
        <ellipse cx="12" cy="3" rx="10" ry="7" fill="#4a5f33"/>
      </g>

      <rect x="128" y="96" width="128" height="46" fill="#57514c"/>
      <rect x="128" y="96" width="128" height="18" fill="#67605a"/>
      <line x1="128" y1="114" x2="256" y2="114" stroke="#241f1c" stroke-width="2"/>
      <rect x="146" y="110" width="6" height="10" fill="#241f1c"/>
      <rect x="182" y="110" width="6" height="10" fill="#241f1c"/>
      <rect x="228" y="110" width="6" height="10" fill="#241f1c"/>
      <line x1="164" y1="96" x2="164" y2="142" stroke="#2c2724" stroke-width="1.5" opacity="0.6"/>
      <line x1="204" y1="96" x2="204" y2="142" stroke="#241f1c" stroke-width="2" opacity="0.7"/>

      <!-- Row 3, offset rhythm from row 1 -->
      <rect x="0" y="176" width="256" height="42" fill="#544e49"/>
      <rect x="0" y="176" width="256" height="19" fill="#645c56"/>
      <line x1="0" y1="197" x2="256" y2="197" stroke="#241f1c" stroke-width="2"/>
      <rect x="30" y="193" width="6" height="10" fill="#241f1c"/>
      <rect x="76" y="193" width="6" height="10" fill="#241f1c"/>
      <rect x="122" y="193" width="6" height="10" fill="#241f1c"/>
      <rect x="176" y="193" width="6" height="10" fill="#241f1c"/>
      <rect x="222" y="193" width="6" height="10" fill="#241f1c"/>
      <line x1="52" y1="176" x2="52" y2="218" stroke="#2c2724" stroke-width="1.5" opacity="0.6"/>
      <line x1="98" y1="176" x2="98" y2="218" stroke="#2c2724" stroke-width="1.5" opacity="0.6"/>
      <line x1="150" y1="176" x2="150" y2="218" stroke="#241f1c" stroke-width="2" opacity="0.7"/>
      <line x1="200" y1="176" x2="200" y2="218" stroke="#2c2724" stroke-width="1.5" opacity="0.6"/>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="url(#terrace)"/>
</svg>
