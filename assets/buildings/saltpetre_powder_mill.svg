<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <ellipse cx="128" cy="222" rx="100" ry="14" fill="#000000" opacity="0.28" />

  <!-- Low, deliberately squat brick mill (kept low/spread-out for safety) -->
