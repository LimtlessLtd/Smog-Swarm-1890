  <rect x="60" y="158" width="130" height="8" fill="#7c6552" />
  <polygon points="54,158 125,132 196,158" fill="#4a4642" />

  <!-- Waterwheel on the side -->
  <circle cx="42" cy="192" r="26" fill="none" stroke="#3a2e22" stroke-width="6" />
  <line x1="42" y1="166" x2="42" y2="218" stroke="#3a2e22" stroke-width="3" />
  <line x1="16" y1="192" x2="68" y2="192" stroke="#3a2e22" stroke-width="3" />
  <line x1="24" y1="174" x2="60" y2="210" stroke="#3a2e22" stroke-width="3" />
  <line x1="24" y1="210" x2="60" y2="174" stroke="#3a2e22" stroke-width="3" />
  <circle cx="42" cy="192" r="5" fill="#241d16" />
  <rect x="40" y="192" width="4" height="18" fill="#2e5a7a" opacity="0.5" />

  <!-- Small windows, no chimney/open flame by design -->
  <rect x="82" y="174" width="16" height="18" fill="#31404a" />
  <rect x="82" y="174" width="16" height="18" fill="none" stroke="#1c2126" stroke-width="1.3" />
  <rect x="150" y="174" width="16" height="18" fill="#3a4a54" />
  <rect x="150" y="174" width="16" height="18" fill="none" stroke="#1c2126" stroke-width="1.3" />
  <rect x="112" y="182" width="22" height="28" fill="#241811" />

  <!-- Hazard marker post at a safe distance -->
  <rect x="204" y="176" width="5" height="34" fill="#3a2e22" />
  <rect x="196" y="176" width="21" height="10" fill="#c9922e" />
  <rect x="196" y="176" width="7" height="10" fill="#241d16" />
  <rect x="210" y="176" width="7" height="10" fill="#241d16" />
