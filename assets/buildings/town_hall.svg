<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <ellipse cx="128" cy="224" rx="112" ry="14" fill="#000000" opacity="0.3" />

  <!-- Main civic block -->
  <rect x="24" y="150" width="208" height="66" fill="#8a7a64" />
  <rect x="24" y="150" width="208" height="8" fill="#a0907a" />

  <!-- Pedimented entrance -->
  <polygon points="70,150 128,118 186,150" fill="#6e6252" />
  <rect x="80" y="128" width="10" height="22" fill="#e6dfc8" />
  <rect x="100" y="128" width="10" height="22" fill="#e6dfc8" />
  <rect x="120" y="128" width="10" height="22" fill="#e6dfc8" />
  <rect x="140" y="128" width="10" height="22" fill="#e6dfc8" />
  <rect x="160" y="128" width="10" height="22" fill="#e6dfc8" />
  <rect x="112" y="176" width="32" height="40" fill="#241a14" />

  <!-- Wing windows -->
  <rect x="36" y="164" width="18" height="22" fill="#31404a" />
  <rect x="36" y="164" width="18" height="22" fill="none" stroke="#1c2126" stroke-width="1.4" />
  <rect x="202" y="164" width="18" height="22" fill="#31404a" />
  <rect x="202" y="164" width="18" height="22" fill="none" stroke="#1c2126" stroke-width="1.4" />

