  <line x1="128" y1="92" x2="128" y2="81" stroke="#2b2822" stroke-width="2" />
  <line x1="128" y1="92" x2="137" y2="95" stroke="#2b2822" stroke-width="2" />
  <polygon points="98,66 128,40 158,66" fill="#4a4642" />

